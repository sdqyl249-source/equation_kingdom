<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>صُورتك - تعديل وتحسين الصور مجاناً</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; text-align: center; color: #333; }
        header { background: #2b5797; color: white; padding: 15px 50px; text-align: center; }
        header h1 { margin: 0; font-size: 32px; }
        .hero { padding: 40px 20px; }
        .upload-box { border: 3px dashed #2b5797; background: white; width: 60%; margin: 20px auto; padding: 30px; border-radius: 10px; }
        .options-group { margin: 20px 0; font-size: 16px; font-weight: bold; text-align: center; }
        .options-group label { margin: 0 15px; cursor: pointer; }
        .ad-space { background: #e0e0e0; width: 60%; margin: 20px auto; padding: 20px; border: 1px dashed #999; color: #666; font-size: 15px; border-radius: 8px; }
        .result-area { margin-top: 20px; }
        img { max-width: 80%; border-radius: 8px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); margin-top: 10px; }
        input[type="file"] { display: none; }
        .custom-file-upload { background-color: #2b5797; color: white; padding: 12px 25px; border-radius: 5px; cursor: pointer; display: inline-block; font-weight: bold; font-size: 16px; }
    </style>
</head>
<body>

    <header>
        <h1>صُورتك - Soortak</h1>
    </header>

    <div class="hero">
        <h2>عدّل وصحّح جودة صورك مجاناً وبثوانٍ معدودة!</h2>
        <p>اختر الخيارات المطلوبة ثم ارفع صورتك لمعالجتها فوراً</p>

        <div class="upload-box">
            <div class="options-group">
                <label>
                    <input type="checkbox" id="removeBgCheck" checked> إزالة الخلفية
                </label>
                <label>
                    <input type="checkbox" id="upscaleCheck" checked> تحسين الألوان وتوضيح التفاصيل
                </label>
            </div>

            <label for="imageInput" class="custom-file-upload">
                📁 اختر صورة لتعديلها
            </label>
            <input type="file" id="imageInput" accept="image/*">
            <p id="statusText" style="color: #777; margin-top: 15px;">حدد الخيارات أعلاه ثم اضغط لرفع الصورة</p>
        </div>

        <div class="result-area" id="resultArea" style="display:none;">
            <h3>النتيجة النهائية:</h3>
            <div id="imageContainer"></div>
        </div>

        <!-- مساحة الإعلانات المخصصة للربح من الموقع -->
        <div class="ad-space">
            📢 [مساحة إعلانات Google AdSense - مصدر الربح الخاص بك]
        </div>
    </div>

    <script>
        // ضع مفتاح Remove.bg الخاص بك هنا
        const REMOVE_BG_KEY = "s71Rek37ZDuodthQyMqFkxzr"; 

        const imageInput = document.getElementById('imageInput');
        const removeBgCheck = document.getElementById('removeBgCheck');
        const upscaleCheck = document.getElementById('upscaleCheck');
        const statusText = document.getElementById('statusText');
        const resultArea = document.getElementById('resultArea');
        const imageContainer = document.getElementById('imageContainer');

        imageInput.addEventListener('change', async function() {
            const file = this.files[0];
            if (!file) return;

            const doRemoveBg = removeBgCheck.checked;
            const doUpscale = upscaleCheck.checked;

            if (!doRemoveBg && !doUpscale) {
                alert("يرجى اختيار ميزة واحدة على الأقل!");
                return;
            }

            statusText.innerText = "⏳ جاري معالجة الصورة...";

            try {
                let imgSourceUrl = URL.createObjectURL(file);

                // 1. تنفيذ إزالة الخلفية إذا تم تحديدها
                if (doRemoveBg) {
                    statusText.innerText = "⏳ جاري إزالة الخلفية...";
                    const formDataBg = new FormData();
                    formDataBg.append('image_file', file);
                    formDataBg.append('size', 'auto');

                    const resBg = await fetch('https://api.remove.bg/v1.0/removebg', {
                        method: 'POST',
                        headers: { 'X-Api-Key': REMOVE_BG_KEY },
                        body: formDataBg
                    });

                    if (!resBg.ok) throw new Error("تأكد من صحة مفتاح Remove.bg الخاص بك");
                    const blobBg = await resBg.blob();
                    imgSourceUrl = URL.createObjectURL(blobBg);
                }

                // 2. تحسين وتوضيح الجودة محلياً في المتصفح مجاناً 100%
                const img = new Image();
                img.src = imgSourceUrl;
                img.onload = function() {
                    const canvas = document.createElement('canvas');
                    const ctx = canvas.getContext('2d');

                    // تكبير الأبعاد قليلاً لرفع الجودة (Upscaling)
                    const scaleFactor = doUpscale ? 1.5 : 1.0;
                    canvas.width = img.width * scaleFactor;
                    canvas.height = img.height * scaleFactor;

                    if (doUpscale) {
                        statusText.innerText = "⏳ جاري تحسين وتوضيح التفاصيل...";
                        // تطبيق فلتر لزيادة التباين، السطوع ووضوح الألوان
                        ctx.filter = 'contrast(115%) brightness(105%) saturate(110%)';
                    }

                    ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
                    const finalDataUrl = canvas.toDataURL('image/png');

                    imageContainer.innerHTML = `
                        <img src="${finalDataUrl}" alt="النتيجة"><br><br>
                        <a href="${finalDataUrl}" download="soortak_result.png" style="background:#ff8c00; color:white; padding:12px 20px; text-decoration:none; border-radius:5px; font-weight:bold;">📥 تحميل الصورة المعدلة</a>
                    `;
                    resultArea.style.display = 'block';
                    statusText.innerText = "تمت معالجة الصورة بنجاح! ✨";
                };

            } catch (error) {
                console.error(error);
                statusText.innerText = "⚠️ " + error.message;
            }
        });
    </script>

</body>
</html>
